<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:inline-flex;align-items:center;justify-content:center;line-height:0">
  <svg viewBox="0 0 60 102" aria-hidden="true" style="width:{{ pxWidth }};height:auto;overflow:visible">
    <g transform="{{ spin }}">
      <sc-for list="{{ strokes }}" as="s" hint-placeholder-count="14">
        <path d="{{ s.d }}" fill="none" stroke="{{ s.ink }}" stroke-width="{{ s.w }}" stroke-linecap="round" opacity="{{ s.op }}" pathLength="{{ 100 }}" stroke-dasharray="100" stroke-dashoffset="{{ s.offset }}"></path>
      </sc-for>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:180},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:28,&quot;min&quot;:14,&quot;max&quot;:120,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;ink&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2438c9&quot;,&quot;options&quot;:[&quot;#2438c9&quot;,&quot;#1b2a8f&quot;,&quot;#b0442f&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;strokeWidth&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:3.4,&quot;min&quot;:1.5,&quot;max&quot;:6,&quot;step&quot;:0.2,&quot;tsType&quot;:&quot;number&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:2.2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;}}">
// 14 strokes, in exact draw order. Each grows from (x1,y1) toward (x2,y2).
// Grid per the canonical construction: x = 0,1,2 -> 12,30,48; y = 5..0 -> 6,24,42,60,78,96
const S = [
  [12, 24, 12, 42],   // 1 upper-left vertical
  [30, 24, 30, 42],   // 2 upper-middle vertical
  [48, 24, 48, 42],   // 3 upper-right vertical
  [12, 60, 12, 78],   // 4 lower-left vertical
  [30, 60, 30, 78],   // 5 lower-middle vertical
  [48, 60, 48, 78],   // 6 lower-right vertical
  [12, 24, 30, 6],    // 7 upper-left diagonal
  [30, 6, 48, 24],    // 8 upper-right diagonal (pointed top)
  [12, 42, 30, 60],   // 9 first middle diagonal
  [30, 42, 48, 60],   // 10 second middle diagonal
  [12, 78, 30, 96],   // 11 lower-left diagonal
  [30, 96, 48, 78],   // 12 lower-right diagonal (pointed bottom)
  [48, 42, 39, 51],   // 13 upper open end -> midpoint of right middle diagonal
  [12, 60, 21, 51],   // 14 lower open end -> midpoint of left middle diagonal
];

// Deterministic pen wobble: endpoint slop, overshoot, bow, width and pressure per stroke.
const J = [
  [ 0.9, -1.1, -0.7,  0.8,  2.4,  1.10, 0.95],
  [-1.2,  0.6,  1.0, -0.9, -1.9,  0.94, 1.00],
  [ 0.7,  1.0, -1.1, -0.6,  1.6,  1.04, 0.90],
  [-0.8, -0.7,  0.9,  1.1, -2.2,  0.97, 0.98],
  [ 1.1,  0.8, -0.6, -1.0,  2.0,  1.08, 0.92],
  [-0.6,  1.2,  1.2,  0.7, -1.5,  0.92, 1.00],
  [ 1.0, -0.9, -1.2,  0.6,  2.6,  1.06, 0.94],
  [-1.1,  0.7,  0.8, -1.2, -2.3,  0.96, 0.97],
  [ 0.6,  1.1, -0.9,  0.9,  1.8,  1.02, 0.91],
  [-0.9, -1.0,  1.1, -0.7, -2.5,  1.09, 0.99],
  [ 1.2,  0.9, -0.8,  1.0,  2.1,  0.93, 0.93],
  [-0.7, -1.2,  0.7, -0.8, -1.7,  1.05, 1.00],
  [ 0.8,  0.6, -1.0,  1.2,  1.4,  0.98, 0.88],
  [-1.0,  1.0,  0.6, -1.1, -1.3,  1.03, 0.90],
];

function penPath(x1, y1, x2, y2, j) {
  const [dx1, dy1, dx2, dy2, bow] = j;
  let ax = x1 + dx1, ay = y1 + dy1, bx = x2 + dx2, by = y2 + dy2;
  const vx = bx - ax, vy = by - ay, len = Math.hypot(vx, vy) || 1;
  const ox = (vx / len) * 1.6, oy = (vy / len) * 1.6; // slight overshoot past the corner
  ax -= ox * 0.5; ay -= oy * 0.5; bx += ox; by += oy;
  const nx = -vy / len, ny = vx / len;
  const mx = (ax + bx) / 2 + nx * bow, my = (ay + by) / 2 + ny * bow;
  const c1x = ax + (mx - ax) * 0.75, c1y = ay + (my - ay) * 0.75;
  const c2x = bx + (mx - bx) * 0.75, c2y = by + (my - by) * 0.75;
  const r = n => n.toFixed(2);
  return `M${r(ax)} ${r(ay)} C ${r(c1x)} ${r(c1y)}, ${r(c2x)} ${r(c2y)}, ${r(bx)} ${r(by)}`;
}

const DRAW = 78;      // ms per stroke, drawing
const ERASE = 58;     // ms per stroke, retracting
const HOLD_FULL = 420;
const ROTATE = 430;
const HOLD_TURNED = 190;
const BLANK = 140;

const T_DRAW = S.length * DRAW;
const T_ERASE = S.length * ERASE;
const TOTAL = T_DRAW + HOLD_FULL + ROTATE + HOLD_TURNED + T_ERASE + BLANK;

class Component extends DCLogic {
  state = { t: 0 };
  componentDidMount() {
    this.start = performance.now();
    const tick = now => {
      this.setState({ t: (now - this.start) % TOTAL });
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  renderVals() {
    const ink = this.props.ink ?? '#2438c9';
    const size = this.props.size ?? 28;
    const w = this.props.strokeWidth ?? 3.4;
    const t = this.state.t;
    const speed = this.props.speed ?? 1;
    const tt = (t * speed) % TOTAL;

    // per-stroke visible fraction 0..1
    const frac = new Array(S.length).fill(0);
    let rot = 0;

    if (tt < T_DRAW) {
      const i = Math.floor(tt / DRAW);
      for (let k = 0; k < i; k++) frac[k] = 1;
      frac[i] = (tt - i * DRAW) / DRAW;
    } else if (tt < T_DRAW + HOLD_FULL) {
      frac.fill(1);
    } else if (tt < T_DRAW + HOLD_FULL + ROTATE) {
      frac.fill(1);
      const p = (tt - T_DRAW - HOLD_FULL) / ROTATE;
      rot = 180 * (p < 0.5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p));
    } else if (tt < T_DRAW + HOLD_FULL + ROTATE + HOLD_TURNED) {
      frac.fill(1);
      rot = 180;
    } else if (tt < TOTAL - BLANK) {
      rot = 180;
      const e = tt - (T_DRAW + HOLD_FULL + ROTATE + HOLD_TURNED);
      const i = Math.floor(e / ERASE);            // 0 = stroke 14 retracts first
      const idx = S.length - 1 - i;
      for (let k = 0; k < idx; k++) frac[k] = 1;
      if (idx >= 0) frac[idx] = 1 - (e - i * ERASE) / ERASE;
    } else {
      rot = 0; // invisible reset while blank
    }

    return {
      pxWidth: size + 'px',
      spin: 'rotate(' + rot.toFixed(2) + ' 30 51)',
      strokes: S.map((p, i) => ({
        d: penPath(p[0], p[1], p[2], p[3], J[i]),
        ink,
        w: +(w * J[i][5]).toFixed(2),
        op: frac[i] <= 0.001 ? 0 : J[i][6],
        offset: (100 * (1 - Math.max(0, Math.min(1, frac[i])))).toFixed(2),
      })),
    };
  }
}
</script>
</body>
</html>
