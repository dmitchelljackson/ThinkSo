services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thinkso}
      POSTGRES_USER: ${POSTGRES_USER:-thinkso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ['uvicorn', 'thinkso.entrypoints.http:app', '--host', '0.0.0.0', '--port', '8000']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://thinkso:local-development-only@postgres:5432/thinkso}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-thinkso-5768a}
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST:-}
    ports:
      - '${API_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ['python', '-m', 'thinkso.entrypoints.worker']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://thinkso:local-development-only@postgres:5432/thinkso}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  scheduler:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ['python', '-m', 'thinkso.entrypoints.scheduler']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://thinkso:local-development-only@postgres:5432/thinkso}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

volumes:
  postgres-data:
